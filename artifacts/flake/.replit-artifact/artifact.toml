kind = "mobile"
previewPath = "/"
title = "Flake"
version = "1.0.0"
id = "artifacts/flake"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24169

[services.development]
run = "pnpm --filter @workspace/flake run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flake", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/flake", "run", "serve" ]

[services.env]
PORT = "24169"
BASE_PATH = "/"
